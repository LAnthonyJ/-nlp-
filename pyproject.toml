[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-course-implementations"
version = "0.1.0"
description = "NLP coursework components with CPU regression tests and examples"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
